# Run from the project root:
#
#   docker compose -f docker/docker-compose.yml up --build --scale chrome=2 --exit-code-from tests
#
# This runs the TestNG suite in parallel across multiple Chrome sessions
# distributed by Selenium Grid across the Chrome nodes.
#
# Each Chrome node supports up to four concurrent sessions.
# With two nodes:
#
#   2 nodes × 4 sessions = 8 concurrent Chrome sessions
#
# Scale browser nodes for additional parallel capacity, for example:
#
#   docker compose -f docker/docker-compose.yml up --build --scale chrome=3 --abort-on-container-exit
#
# Three nodes provide:
#
#   3 nodes × 4 sessions = 12 concurrent Chrome sessions
#
# Selenium images use a dated tag (4.49.0-20260909) to pin the Grid and
# browser environment to a specific image build, providing reproducible
# test runs. Upgrade the tag deliberately when updating the Selenium/Chrome
# execution environment.
#
# The same Compose file is used locally, in Jenkins, and on the AWS EC2 host.
# See docs/AWS_EC2_SETUP.md for EC2-specific setup steps.

services:

  selenium-hub:
    image: selenium/hub:4.49.0-20260909
    container_name: selenium-hub

    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:4444/wd/hub/status"
        ]
      interval: 5s
      timeout: 5s
      retries: 20


  chrome:
    image: selenium/node-chrome:4.49.0-20260909

    depends_on:
      selenium-hub:
        condition: service_healthy

    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443

      # Maximum concurrent Chrome sessions per node.
      SE_NODE_MAX_SESSIONS: 4

    shm_size: 2gb


  tests:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    container_name: selenium-tests

    depends_on:
      selenium-hub:
        condition: service_healthy

    environment:
      GRID_URL: http://selenium-hub:4444/wd/hub
      TEST_BROWSER: chrome
      HEADLESS: "true"

    volumes:
      - ../target:/workspace/target
