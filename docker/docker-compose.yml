# Run from the project root:
#
# Build the test-runner image locally:
#
#   docker build -f docker/Dockerfile -t selenium-java-automation:test .
#
# Run the test suite against Selenium Grid with two Chrome nodes:
#
#   TEST_RUNNER_IMAGE=selenium-java-automation:test \
#   docker compose -f docker/docker-compose.yml up \
#     --scale chrome=2 \
#     --exit-code-from tests
#
# Each Chrome node supports up to four concurrent sessions.
#
# Two nodes:
#
#   2 nodes × 4 sessions = 8 concurrent browser sessions
#
# Scale browser nodes for additional Grid capacity, for example:
#
#   TEST_RUNNER_IMAGE=selenium-java-automation:test \
#   docker compose -f docker/docker-compose.yml up \
#     --scale chrome=3 \
#     --exit-code-from tests
#
# Three nodes:
#
#   3 nodes × 4 sessions = 12 concurrent browser sessions
#
# TestNG controls test parallelism; Selenium Grid distributes WebDriver
# sessions across the available Chrome node capacity.
#
# Selenium images use a dated tag (4.49.0-20260909) to pin the Grid and
# browser environment to a specific image build. Upgrade the tag deliberately
# when updating the Selenium/Chrome execution environment.
#
# The same Compose file can be used locally, in Jenkins, and on AWS EC2.
# See docs/AWS_EC2_SETUP.md for EC2-specific setup steps.


services:

  selenium-hub:
    image: selenium/hub:4.49.0-20260909
    container_name: selenium-hub

    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:4444/wd/hub/status"
        ]
      interval: 5s
      timeout: 5s
      retries: 20


  chrome:
    image: selenium/node-chrome:4.49.0-20260909

    depends_on:
      selenium-hub:
        condition: service_healthy

    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443

      # Maximum concurrent Chrome sessions per node.
      SE_NODE_MAX_SESSIONS: 4

    shm_size: 2gb


  tests:
    # Jenkins supplies TEST_RUNNER_IMAGE.
    # Local execution defaults to the locally built test image.
    image: ${TEST_RUNNER_IMAGE:-selenium-java-automation:test}

    container_name: selenium-tests

    depends_on:
      selenium-hub:
        condition: service_healthy

    environment:
      GRID_URL: http://selenium-hub:4444/wd/hub
      TEST_BROWSER: chrome
      HEADLESS: "true"

    volumes:
      - ../target:/workspace/target