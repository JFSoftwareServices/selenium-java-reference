# Run from the project root:
#   docker compose -f docker/docker-compose.yml up --build --abort-on-container-exit
#
# Scale nodes for more parallel capacity, e.g. 3 Chrome nodes:
#   docker compose -f docker/docker-compose.yml up --build --scale chrome=3 --abort-on-container-exit
#
# Same file is used locally, in Jenkins, and on the AWS EC2 host - see
# docs/AWS_EC2_SETUP.md for the EC2-specific setup steps.

services:
  selenium-hub:
    image: selenium/hub:4.27.0
    container_name: selenium-hub
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/wd/hub/status"]
      interval: 5s
      timeout: 5s
      retries: 20

  chrome:
    image: selenium/node-chrome:4.27.0
    depends_on:
      selenium-hub:
        condition: service_healthy
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
    shm_size: 2gb
    # noVNC available on the host-mapped port for watching a headed run,
    # e.g. http://<ec2-public-ip>:7900 (password: "secret").
    ports:
      - "7900"

  firefox:
    image: selenium/node-firefox:4.27.0
    depends_on:
      selenium-hub:
        condition: service_healthy
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
    shm_size: 2gb
    ports:
      - "7900"

  tests:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: selenium-tests
    depends_on:
      selenium-hub:
        condition: service_healthy
      chrome:
        condition: service_started
      firefox:
        condition: service_started
    env_file:
      - ../.env
    environment:
      - GRID_URL=http://selenium-hub:4444/wd/hub
      - TEST_BROWSER=${TEST_BROWSER:-chrome}
      - HEADLESS=true
    volumes:
      - ../target:/workspace/target
